schema_version: fasterraster.capability-registry/v2
registry_version: 1.0.0
release:
  package_version: 1.0.0b5
  published_package_version: 1.0.0b5
  public_release: v1.0.0-beta.5
  development_label: 1.0.0b5 (published beta)
  contract_status: published
  next_release: "not scheduled"
status_definitions:
  released: Legacy alias for published; retained for Source Pack v1 compatibility.
  experimental: Legacy alias for unreleased_public; retained for Source Pack v1 compatibility.
  private: Consumed only by a proprietary execution backend; no private implementation is public.
  planned: Directional work without an executable public contract.
  unsupported: Explicitly outside the current public product.
release_state_definitions:
  published: Included in the published public beta.
  unreleased_public: Implemented or contracted in the public source tree but not part of the published beta contract.
  private: Consumed only by a proprietary execution backend; no private implementation is public.
  planned: Directional work without an executable public contract.
  unsupported: Explicitly outside the current public product.
evidence_definitions:
  live_route_certified: A checked-in sanitized receipt, present at the declared public commit, proves a bounded live route.
  live_dataset_certified: A checked-in sanitized receipt, present at the declared public commit, proves a named live dataset validation.
  fixture_validated: Deterministic checked-in fixtures exercise the contract.
  contract_validated: Schema/compiler validation only; no live dataset claim.
evidence_records:
  prism_ames_2023:
    scope: Ames PRISM daily ZIP validation, bounded public route
    date: "2026-07-31"
