[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faster-raster"
version = "1.0.0b1"
description = "Source-aware raster orchestration from explicit study contracts to reproducible evidence and publications."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Duncan" }
]
keywords = ["geospatial", "raster", "GIS", "reproducibility", "orchestration"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "numpy>=1.26,<3.0",
  "rasterio>=1.3.10,<2.0"
]

[project.urls]
Homepage = "https://dmsrsic.github.io/faster-raster/"
Documentation = "https://dmsrsic.github.io/faster-raster/"
Repository = "https://github.com/dmsrsic/faster-raster"
Issues = "https://github.com/dmsrsic/faster-raster/issues"
Changelog = "https://github.com/dmsrsic/faster-raster/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10"
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.6,<10"
]
classification = [
  "scikit-learn>=1.5,<2.0"
]

[project.scripts]
faster-raster = "faster_raster.cli:app"

fr = "faster_raster.fr_cli:main"
fr-beta-check = "faster_raster.beta_check:main"

[tool.hatch.build.targets.wheel.force-include]
"configs" = "configs"
"examples" = "examples"
"recipes" = "recipes"
"schemas" = "schemas"
"scripts/fr-cook-ag" = "scripts/fr-cook-ag"
"scripts/lib" = "scripts/lib"

[tool.hatch.build.targets.sdist]
exclude = [
  "/reports",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
