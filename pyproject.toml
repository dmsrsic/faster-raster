[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faster-raster"
version = "1.0.0a3"
description = "Deterministic raster URL planning and harmonization planning."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "PyYAML>=6.0",
  "Pillow>=10.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
faster-raster = "faster_raster.cli:app"

fr = "faster_raster.fr_cli:main"
fr-beta-check = "faster_raster.beta_check:main"

[tool.hatch.build.targets.wheel.force-include]
"configs" = "configs"
"examples" = "examples"
"recipes" = "recipes"
"schemas" = "schemas"
"scripts/fr-cook-ag" = "scripts/fr-cook-ag"
"scripts/lib" = "scripts/lib"

[tool.pytest.ini_options]
testpaths = ["tests"]
