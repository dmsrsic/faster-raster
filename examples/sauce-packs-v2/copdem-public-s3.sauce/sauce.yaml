schema_version: fasterraster.source-pack/v2
pack_id: copdem-public-s3
display_name: Copernicus DEM over public S3
description: Generic unsigned S3 access contract for the same Copernicus DEM product.
adapter:
  family: stac_search
  endpoint: https://earth-search.aws.element84.com/v1
  media_types:
    - image/tiff; application=geotiff; profile=cloud-optimized
  asset_roles: [data]
capabilities:
  planning: true
  preview: true
  materialization: true
  analysis: false
  temporal_discovery: false
source:
  semantic_type: continuous
  crs: EPSG:4326
  resampling: bilinear
  nodata: null
  mask_policy: all_valid
access:
  authentication_scheme: none
  allowed_hosts: [earth-search.aws.element84.com]
  redirect_hosts: []
  asset_hosts: [copernicus-dem-30m.s3.eu-central-1.amazonaws.com]
  asset_host_suffixes: []
  resolver_hosts: []
  resolver_host_suffixes: []
asset_access:
  mode: s3_public
  stable_identity:
    scheme: s3
    bucket: copernicus-dem-30m
    region: eu-central-1
    key_policy: selected_stac_asset
network:
  max_requests: 3
  max_bytes: 65536
  max_asset_bytes: 75000000
  max_total_bytes: 76000000
  timeout_seconds: 30
  maximum_redirects: 0
  max_parallel_requests: 1
temporal:
  mode: static
  requested: null
  tolerance_days: null
  template_variables: {}
preview:
  template_id: general_multisource_v1
  role: natural_color
  theme: elevation
  target_crs: EPSG:32614
family_contract:
  search_path: /search
  temporal_representation: datetime
  bbox_crs: EPSG:4326
  asset_host_scope: [copernicus-dem-30m.s3.eu-central-1.amazonaws.com]
  asset_selection:
    item_limit: 4
    item_order: [datetime, id]
    required_media_types:
      - image/tiff; application=geotiff; profile=cloud-optimized
    required_roles: [data]
