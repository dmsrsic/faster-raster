schema_version: fasterraster.source-pack/v2
pack_id: earth-engine-worldcover
display_name: Earth Engine WorldCover categorical map
description: Public-only closed categorical computation contract with nearest resampling.
adapter:
  family: earth_engine_compute
  endpoint: null
  url_template: null
  local_path: null
  local_sha256: null
  media_types: [image/tiff]
  asset_roles: [Map]
capabilities:
  planning: true
  preview: true
  materialization: false
  analysis: false
  temporal_discovery: false
source:
  semantic_type: categorical
  crs: EPSG:4326
  resampling: nearest
  nodata: null
  mask_policy: alpha_or_dataset_mask
access:
  authentication_scheme: none
  allowed_hosts: []
  redirect_hosts: []
  asset_hosts: []
  asset_host_suffixes: []
  resolver_hosts: []
  resolver_host_suffixes: []
asset_access: null
network:
  max_requests: 1
  max_bytes: 65536
  max_asset_bytes: 5000000
  max_total_bytes: 5000000
  timeout_seconds: 10
  maximum_redirects: 0
  max_parallel_requests: 1
temporal:
  mode: static
  requested: "2021"
  tolerance_days: null
  template_variables: {}
preview:
  template_id: general_multisource_v1
  role: natural_color
  theme: classification
  target_crs: EPSG:32614
family_contract:
  dataset_identity: ESA/WorldCover/v200
earth_engine:
  dataset_id: ESA/WorldCover/v200
  dataset_type: image_collection
  bands:
    - name: Map
      semantic_type: categorical
      data_type: uint8
  allowed_operations:
    - load_collection
    - filter_bounds
    - sort_acquisition_time
    - tie_break_system_index
    - select_first
    - select_bands
  credential_scheme: google_adc
  max_uncompressed_response_bytes: 1000000
  max_width: 32000
  max_height: 32000
  max_bands: 1
