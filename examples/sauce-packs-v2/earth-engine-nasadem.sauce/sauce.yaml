schema_version: fasterraster.source-pack/v2
pack_id: earth-engine-nasadem
display_name: Earth Engine NASADEM
description: Public-only closed computation contract for a fixed continuous image.
adapter:
  family: earth_engine_compute
  endpoint: null
  url_template: null
  local_path: null
  local_sha256: null
  media_types: [image/tiff]
  asset_roles: [elevation]
capabilities:
  planning: true
  preview: true
  materialization: false
  analysis: false
  temporal_discovery: false
source:
  semantic_type: continuous
  crs: EPSG:4326
  resampling: bilinear
  nodata: null
  mask_policy: alpha_or_dataset_mask
access:
  authentication_scheme: none
  allowed_hosts: []
  redirect_hosts: []
  asset_hosts: []
  asset_host_suffixes: []
  resolver_hosts: []
  resolver_host_suffixes: []
asset_access: null
network:
  max_requests: 1
  max_bytes: 65536
  max_asset_bytes: 5000000
  max_total_bytes: 5000000
  timeout_seconds: 10
  maximum_redirects: 0
  max_parallel_requests: 1
temporal:
  mode: static
  requested: null
  tolerance_days: null
  template_variables: {}
preview:
  template_id: general_multisource_v1
  role: natural_color
  theme: elevation
  target_crs: EPSG:32614
family_contract:
  dataset_identity: NASA/NASADEM_HGT/001
earth_engine:
  dataset_id: NASA/NASADEM_HGT/001
  dataset_type: image
  bands:
    - name: elevation
      semantic_type: continuous
      data_type: int16
  allowed_operations: [load_image, select_bands]
  credential_scheme: google_adc
  max_uncompressed_response_bytes: 1000000
  max_width: 32000
  max_height: 32000
  max_bands: 1
