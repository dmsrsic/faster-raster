schema_version: fasterraster.source-pack/v2
pack_id: earth-engine-sentinel2
display_name: Earth Engine Sentinel-2 deterministic RGB
description: Public-only closed temporal collection contract with deterministic selection.
adapter:
  family: earth_engine_compute
  endpoint: null
  url_template: null
  local_path: null
  local_sha256: null
  media_types: [image/tiff]
  asset_roles: [B4, B3, B2]
capabilities:
  planning: true
  preview: true
  materialization: false
  analysis: false
  temporal_discovery: true
source:
  semantic_type: continuous
  crs: EPSG:4326
  resampling: bilinear
  nodata: null
  mask_policy: alpha_or_dataset_mask
access:
  authentication_scheme: none
  allowed_hosts: []
  redirect_hosts: []
  asset_hosts: []
  asset_host_suffixes: []
  resolver_hosts: []
  resolver_host_suffixes: []
asset_access: null
network:
  max_requests: 1
  max_bytes: 65536
  max_asset_bytes: 5000000
  max_total_bytes: 5000000
  timeout_seconds: 10
  maximum_redirects: 0
  max_parallel_requests: 1
temporal:
  mode: exact
  requested: "2023-06-01/2023-06-10"
  tolerance_days: 0
  template_variables: {}
preview:
  template_id: general_multisource_v1
  role: natural_color
  theme: optical_imagery
  target_crs: EPSG:32614
family_contract:
  dataset_identity: COPERNICUS/S2_SR_HARMONIZED
earth_engine:
  dataset_id: COPERNICUS/S2_SR_HARMONIZED
  dataset_type: image_collection
  bands:
    - name: B2
      semantic_type: continuous
      data_type: uint16
    - name: B3
      semantic_type: continuous
      data_type: uint16
    - name: B4
      semantic_type: continuous
      data_type: uint16
  allowed_operations:
    - load_collection
    - filter_bounds
    - filter_date
    - sort_acquisition_time
    - tie_break_system_index
    - select_first
    - select_bands
  credential_scheme: google_adc
  max_uncompressed_response_bytes: 1000000
  max_width: 32000
  max_height: 32000
  max_bands: 3
