schema_version: fasterraster.source-pack/v2
pack_id: planetary-computer-signed
display_name: Broker-signed Landsat STAC asset
description: Generic ephemeral-HTTPS signer contract with unsigned stable identity.
adapter:
  family: stac_search
  endpoint: https://planetarycomputer.microsoft.com/api/stac/v1
  media_types:
    - image/tiff; application=geotiff; profile=cloud-optimized
  asset_roles: [red]
capabilities:
  planning: true
  preview: true
  materialization: true
  analysis: false
  temporal_discovery: true
source:
  semantic_type: continuous
  crs: EPSG:32614
  resampling: bilinear
  nodata: 0
  mask_policy: explicit_nodata
access:
  authentication_scheme: none
  allowed_hosts: [planetarycomputer.microsoft.com]
  redirect_hosts: []
  asset_hosts: []
  asset_host_suffixes: [blob.core.windows.net]
  resolver_hosts: [planetarycomputer.microsoft.com]
  resolver_host_suffixes: []
asset_access:
  mode: brokered_signed_https
  stable_identity:
    href_policy: unsigned_selected_stac_asset
  resolver:
    scheme: ephemeral_https_signer
    endpoint: https://planetarycomputer.microsoft.com/api/sas/v1/sign
    method: GET
    href_parameter: href
    response_field: href
network:
  max_requests: 4
  max_bytes: 1000000
  max_asset_bytes: 250000000
  max_total_bytes: 251000000
  timeout_seconds: 10
  maximum_redirects: 0
  max_parallel_requests: 1
temporal:
  mode: exact
  requested: "2023-06"
  tolerance_days: 60
  template_variables: {}
preview:
  template_id: general_multisource_v1
  role: natural_color
  theme: optical_imagery
  target_crs: EPSG:32614
family_contract:
  search_path: /search
  temporal_representation: interval
  bbox_crs: EPSG:4326
  asset_host_scope: []
  asset_selection:
    item_limit: 10
    item_order: [datetime, id]
    required_media_types:
      - image/tiff; application=geotiff; profile=cloud-optimized
    required_roles: [red]
