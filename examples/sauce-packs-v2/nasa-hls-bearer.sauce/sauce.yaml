schema_version: fasterraster.source-pack/v2
pack_id: nasa-hls-bearer
display_name: NASA HLS bearer-authorized asset
description: Generic public-catalogue and bearer-authorized asset contract.
adapter:
  family: stac_search
  endpoint: https://cmr.earthdata.nasa.gov/stac/LPCLOUD
  media_types:
    - image/tiff; application=geotiff; profile=cloud-optimized
  asset_roles: [red]
capabilities:
  planning: true
  preview: true
  materialization: true
  analysis: false
  temporal_discovery: true
source:
  semantic_type: continuous
  crs: EPSG:4326
  resampling: bilinear
  nodata: null
  mask_policy: alpha_or_dataset_mask
access:
  authentication_scheme: none
  allowed_hosts: [cmr.earthdata.nasa.gov]
  redirect_hosts: []
  asset_hosts: [data.lpdaac.earthdatacloud.nasa.gov]
  asset_host_suffixes: []
  resolver_hosts: []
  resolver_host_suffixes: []
asset_access:
  mode: bearer_https
  stable_identity:
    href_policy: unsigned_selected_stac_asset
  credential_scheme: oauth2_bearer
network:
  max_requests: 3
  max_bytes: 65536
  max_asset_bytes: 200000000
  max_total_bytes: 201000000
  timeout_seconds: 10
  maximum_redirects: 0
  max_parallel_requests: 1
temporal:
  mode: exact
  requested: "2023-06"
  tolerance_days: 60
  template_variables: {}
preview:
  template_id: general_multisource_v1
  role: natural_color
  theme: optical_imagery
  target_crs: EPSG:32614
family_contract:
  search_path: /search
  temporal_representation: interval
  bbox_crs: EPSG:4326
  asset_host_scope: [data.lpdaac.earthdatacloud.nasa.gov]
  asset_selection:
    item_limit: 10
    item_order: [datetime, id]
    required_media_types:
      - image/tiff; application=geotiff; profile=cloud-optimized
    required_roles: [red]
