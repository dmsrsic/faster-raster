site_name: FasterRaster
site_description: Source-aware raster orchestration for bounded, reproducible local studies.
docs_dir: docs
site_dir: site
strict: true
use_directory_urls: true
exclude_docs: |
  [A-Z]*.md
theme:
  name: mkdocs
  color_mode: auto
  user_color_mode_toggle: true
nav:
  - Home: index.md
  - Installation: installation.md
  - Five-minute quickstart: quickstart.md
  - Terminal playground: terminal-playground.md
  - Concepts and architecture: concepts.md
  - Supported sources: supported-sources.md
  - Human-development workflow: human-development.md
  - Hybrid publication: hybrid-publication.md
  - Determinism, provenance, and reuse: determinism.md
  - Network and byte budgets: network-byte-budgets.md
  - Errors and recovery: errors-recovery.md
  - Examples: examples.md
  - Known limitations: limitations.md
  - Roadmap: roadmap.md
  - CI and release validation: ci.md
  - Contributing: contributing.md
  - Citation: citation.md
  - Security: security.md
  - Release notes: release-notes.md
markdown_extensions:
  - admonition
  - attr_list
  - tables
