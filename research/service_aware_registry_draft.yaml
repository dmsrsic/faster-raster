    semantic_contract:
      default_semantic_type: mixed
      allowed_layers:
        surface_reflectance:
          semantic_type: continuous
          recommended_resampling: bilinear
          nodata: null
          legend_url: null
          qa_policy: "needs_official_verification"
        qa_pixel:
          semantic_type: categorical
          recommended_resampling: nearest
          nodata: null
          legend_url: null
          qa_policy: "required"
      crs:
