        placeholders: [year, variable, region]
    expected_format: unknown
    spatial_keys: {bbox: unknown, region: unknown}
    temporal_keys: {year: true, date_range: unknown}
    crs: {source_crs: unknown, bbox_crs: unknown, export_image_crs: unknown, target_grid_crs_recommendation: EPSG:5070}
    raster_semantics: {semantic_type: continuous, resampling: bilinear, nodata: unknown}
    validation: {checksum_available: unknown, metadata_endpoint: unknown, coverage_test_possible: unknown, bounded_probe_safe: unknown}
